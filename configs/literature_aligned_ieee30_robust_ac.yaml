# Draft / optional config.
# This approximates a lightweight literature-style robust AC setup using
# generated voltage, injection, and branch-flow rows from a PYPOWER IEEE30
# benchmark case. Stress levels are controlled assumptions, not field-calibrated
# PMU/SCADA statistics.

run_name: literature_aligned_ieee30_robust_ac
seed: 130

system:
  case_name: ieee30
  case_source: pypower
  mode: ac_power_flow_linearized
  measurement:
    include_voltage_magnitudes: true
    include_p_injections: true
    include_q_injections: true
    include_p_branch_flows: true
    include_q_branch_flows: true
    voltage_std: 0.01
    injection_p_std: 0.03
    injection_q_std: 0.03
    flow_p_std: 0.02
    flow_q_std: 0.02
    weak_area_buses: [24, 25, 26, 27, 28, 29, 30]
    weak_area_std_multiplier: 5.0
  linearization:
    angle_perturbation_std: 0.005
    voltage_perturbation_std: 0.005
    min_voltage_magnitude: 0.5

scenario:
  name: draft_literature_style_ieee30_robust_ac
  noise_std: 0.002
  missing_ratio: 0.05
  bad_data:
    enabled: true
    ratio: 0.03
    magnitude: 5.0
    target: weak_area

estimators:
  - name: pseudoinverse
    rcond: 1.0e-10
  - name: ridge
    alpha: 1.0e-4
  - name: truncated_svd
    tau: 1.0e-5
  - name: qsvt_regularized
    alpha: 1.0e-4
  - name: huber_irls
    delta: 1.5
    max_iterations: 10
    tolerance: 1.0e-7

qsvt_resource:
  enabled: false

output:
  root: outputs
  run_id: literature_aligned_ieee30_robust_ac
  save_plots: false
  overwrite: false
