run_name: ieee14_ac_sweeps
seed: 500

system:
  case_name: ieee14
  mode: ac_power_flow_linearized
  measurement:
    include_voltage_magnitudes: true
    include_p_injections: true
    include_q_injections: true
    include_p_branch_flows: true
    include_q_branch_flows: true
    voltage_std: 0.01
    injection_p_std: 0.03
    injection_q_std: 0.03
    flow_p_std: 0.02
    flow_q_std: 0.02
    weak_area_buses: [12, 13, 14]
    weak_area_std_multiplier: 10.0
  linearization:
    angle_perturbation_std: 0.01
    voltage_perturbation_std: 0.01
    min_voltage_magnitude: 0.5

scenario:
  name: ac_linearized_sweeps
  noise_std: 0.002
  missing_ratio: 0.1

sweeps:
  - name: noise_sweep
    parameter: scenario.noise_std
    values: [0.0, 0.001, 0.002, 0.01]
    seeds: [501, 502, 503]
  - name: missing_sweep
    parameter: scenario.missing_ratio
    values: [0.0, 0.1, 0.2, 0.3]
    seeds: [501, 502, 503]
  - name: linearization_sweep
    parameter: system.linearization.angle_perturbation_std
    values: [0.0, 0.005, 0.01, 0.02]
    seeds: [501, 502, 503]

estimators:
  - name: pseudoinverse
    rcond: 1.0e-12
  - name: ridge
    alpha: 1.0e-4
  - name: truncated_svd
    tau: 1.0e-5
  - name: qsvt_regularized
    alpha: 1.0e-4

qsvt_resource:
  enabled: true
  degrees: [4, 8, 16, 32]
  grid_size: 512
  target_error: 1.0e-3

output:
  root: outputs
  run_id: ieee14_ac_sweeps
  save_plots: true
  overwrite: true
