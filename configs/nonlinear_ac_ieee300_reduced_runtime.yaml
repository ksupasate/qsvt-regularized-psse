run_name: nonlinear_ac_ieee300_reduced_runtime
seed: 101

system:
  case_name: ieee300
  case_source: pypower
  mode: nonlinear_ac_state_estimation
  measurement:
    include_voltage_magnitudes: true
    include_p_injections: true
    include_q_injections: true
    include_p_branch_flows: true
    include_q_branch_flows: true
    voltage_std: 0.01
    injection_p_std: 0.03
    injection_q_std: 0.03
    flow_p_std: 0.02
    flow_q_std: 0.02
    weak_area_buses: [9042, 9043, 9044, 9051, 9052, 9053, 9054, 9055, 9071, 9072, 9121, 9533]
    weak_area_std_multiplier: 10.0
  linearization:
    angle_perturbation_std: 0.005
    voltage_perturbation_std: 0.005
    min_voltage_magnitude: 0.5
  iteration:
    max_iterations: 2
    update_tolerance: 1.0e-7
    residual_tolerance: 1.0e-7
    damping: 1.0
    max_update_norm: 1000.0
    residual_growth_limit: 10000.0

scenario:
  name: nonlinear_ac_ieee300_reduced_runtime
  noise_std: 0.002
  missing_ratio: 0.1
  bad_data:
    enabled: true
    ratio: 0.05
    magnitude: 5.0
    target: weak_area

sweeps:
  - name: nonlinear_noise_sweep_reduced
    parameter: scenario.noise_std
    values: [0.0, 0.002]
    seeds: [101, 202]
  - name: nonlinear_missing_sweep_reduced
    parameter: scenario.missing_ratio
    values: [0.0, 0.1]
    seeds: [101, 202]
  - name: nonlinear_bad_data_ratio_sweep_reduced
    parameter: scenario.bad_data.ratio
    values: [0.0, 0.05]
    seeds: [101, 202]

estimators:
  - name: pseudoinverse
    rcond: 1.0e-10
  - name: ridge
    alpha: 1.0e-4
  - name: qsvt_regularized
    alpha: 1.0e-4
  - name: huber_irls
    delta: 1.5
    max_iterations: 5
    tolerance: 1.0e-7

qsvt_resource:
  enabled: true
  degrees: [4, 8]
  grid_size: 256
  target_error: 1.0e-3

output:
  root: outputs
  run_id: nonlinear_ac_ieee300_reduced_runtime
  save_plots: true
  overwrite: true
