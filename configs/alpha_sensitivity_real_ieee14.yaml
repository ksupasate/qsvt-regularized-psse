run_name: alpha_sensitivity_real_ieee14
seed: 101

system:
  case_name: ieee14
  case_source: pypower
  mode: ac_power_flow_linearized
  measurement:
    include_voltage_magnitudes: true
    include_p_injections: true
    include_q_injections: false
    include_p_branch_flows: true
    include_q_branch_flows: false
    voltage_std: 0.01
    injection_p_std: 0.03
    injection_q_std: 0.03
    flow_p_std: 0.02
    flow_q_std: 0.02
    weak_area_buses: [12, 13, 14]
    weak_area_std_multiplier: 10.0
  linearization:
    angle_perturbation_std: 0.005
    voltage_perturbation_std: 0.005
    min_voltage_magnitude: 0.5

scenario:
  name: alpha_sensitivity_real_ieee14
  noise_std: 0.002
  missing_ratio: 0.1
  bad_data:
    enabled: true
    ratio: 0.05
    magnitude: 5.0
    target: weak_area

sweeps:
  - name: ridge_qsvt_alpha_sweep
    parameter: estimators.1.alpha
    linked_parameters: [estimators.3.alpha]
    values: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
    seeds: [101, 202, 303]

estimators:
  - name: pseudoinverse
    rcond: 1.0e-10
  - name: ridge
    alpha: 1.0e-4
  - name: truncated_svd
    tau: 1.0e-5
  - name: qsvt_regularized
    alpha: 1.0e-4

qsvt_resource:
  enabled: false

output:
  root: outputs
  run_id: alpha_sensitivity_real_ieee14
  save_plots: false
  overwrite: false
