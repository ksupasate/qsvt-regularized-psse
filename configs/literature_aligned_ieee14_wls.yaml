# Draft / optional config.
# This approximates a literature-style WLS setup with PSSE-like voltage,
# injection, and branch-flow measurement types generated from a PYPOWER IEEE14
# benchmark case. It is not field-calibrated and does not encode real sensor
# placement records.

run_name: literature_aligned_ieee14_wls
seed: 114

system:
  case_name: ieee14
  case_source: pypower
  mode: ac_power_flow_linearized
  measurement:
    include_voltage_magnitudes: true
    include_p_injections: true
    include_q_injections: true
    include_p_branch_flows: true
    include_q_branch_flows: true
    voltage_std: 0.01
    injection_p_std: 0.03
    injection_q_std: 0.03
    flow_p_std: 0.02
    flow_q_std: 0.02
    weak_area_buses: []
    weak_area_std_multiplier: 1.0
  linearization:
    angle_perturbation_std: 0.005
    voltage_perturbation_std: 0.005
    min_voltage_magnitude: 0.5

scenario:
  name: draft_literature_style_ieee14_wls
  noise_std: 0.002
  missing_ratio: 0.0
  bad_data:
    enabled: false
    ratio: 0.0
    magnitude: 5.0
    target: random

estimators:
  - name: normal_equation_wls
    max_gain_condition_number: 1.0e18
  - name: pseudoinverse
    rcond: 1.0e-10
  - name: ridge
    alpha: 1.0e-4
  - name: truncated_svd
    tau: 1.0e-5
  - name: qsvt_regularized
    alpha: 1.0e-4

qsvt_resource:
  enabled: false

output:
  root: outputs
  run_id: literature_aligned_ieee14_wls
  save_plots: false
  overwrite: false
