demo:
  run_id: qsvt_phase_validation_paper
  output_dir: outputs/qsvt_phase_validation_paper
  alpha: 0.01
  degree: 35
  domain_min: 0.2
  domain_max: 1.0
  block_encoding_normalization: 1.0
  grid_size: 4096
  phase_validation_grid_size: 257
  seed: 123
  max_nfev: 4000
  phase_synthesis_method: pennylane_poly_to_angles
  angle_solver: iterative
  phase_cache_dir: outputs/qsvt_phase_cache
  require_phase_validation: true
  polynomial_max_error_target: 0.01
  polynomial_mean_error_target: 0.001
  phase_max_error_target: 0.05
  phase_mean_error_target: 0.01
  singular_values: [0.2, 0.35, 0.6, 0.85]

