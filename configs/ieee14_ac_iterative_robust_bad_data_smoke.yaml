run_name: ieee14_ac_iterative_robust_bad_data_smoke
seed: 930

system:
  case_name: ieee14
  mode: ac_iterative_state_estimation
  measurement:
    include_voltage_magnitudes: true
    include_p_injections: true
    include_q_injections: true
    include_p_branch_flows: true
    include_q_branch_flows: true
    voltage_std: 0.01
    injection_p_std: 0.03
    injection_q_std: 0.03
    flow_p_std: 0.02
    flow_q_std: 0.02
    weak_area_buses: [12, 13, 14]
    weak_area_std_multiplier: 15.0
  linearization:
    angle_perturbation_std: 0.01
    voltage_perturbation_std: 0.01
    min_voltage_magnitude: 0.5
  iteration:
    max_iterations: 10
    update_tolerance: 1.0e-8
    residual_tolerance: 1.0e-8
    damping: 1.0

scenario:
  name: iterative_robust_ac_bad_data_smoke
  noise_std: 0.001
  missing_ratio: 0.0
  bad_data:
    enabled: true
    ratio: 0.05
    magnitude: 5.0
    target: weak_area

estimators:
  - name: pseudoinverse
    rcond: 1.0e-12
  - name: ridge
    alpha: 1.0e-6
  - name: truncated_svd
    tau: 1.0e-8
  - name: qsvt_regularized
    alpha: 1.0e-6
  - name: huber_irls
    delta: 1.5
    max_iterations: 50
    tolerance: 1.0e-8
  - name: lav

qsvt_resource:
  enabled: true
  degrees: [4, 8, 16, 32]
  grid_size: 512
  target_error: 1.0e-3

output:
  root: outputs
  run_id: ieee14_ac_iterative_robust_bad_data_smoke_seed930
  save_plots: true
  overwrite: true
