run_name: real_ieee_high_stress_missing_baselines
seed: 101

system:
  case_name: ieee14
  case_source: pypower
  mode: ac_power_flow_linearized
  measurement:
    include_voltage_magnitudes: true
    include_p_injections: true
    include_q_injections: false
    include_p_branch_flows: true
    include_q_branch_flows: false
    voltage_std: 0.01
    injection_p_std: 0.03
    injection_q_std: 0.03
    flow_p_std: 0.02
    flow_q_std: 0.02
    weak_area_buses: [12, 13, 14]
    weak_area_std_multiplier: 30.0
  linearization:
    angle_perturbation_std: 0.005
    voltage_perturbation_std: 0.005
    min_voltage_magnitude: 0.5

scenario:
  name: ieee14_high_stress_missing_baselines
  noise_std: 0.01
  missing_ratio: 0.2
  bad_data:
    enabled: true
    ratio: 0.1
    magnitude: 5.0
    target: weak_area

sweeps:
  - name: ieee14_high_stress_missing_sweep
    parameter: scenario.missing_ratio
    values: [0.0, 0.1, 0.2]
    seeds: [101, 202, 303]

estimators:
  - name: pseudoinverse
    rcond: 1.0e-10
  - name: normal_equation_wls
    max_gain_condition_number: 1.0e18
  - name: ridge
    alpha: 1.0e-4
  - name: truncated_svd
    tau: 1.0e-5
  - name: qsvt_regularized
    alpha: 1.0e-4
  - name: qsvt_unregularized_inverse
    cutoff: 1.0e-8
  - name: hhl_style_inverse_proxy
    cutoff: 1.0e-8
    precision: 1.0e-3
    instability_condition_threshold: 1.0e8
    fail_on_instability: false

qsvt_resource:
  enabled: false

output:
  root: outputs
  run_id: real_ieee_high_stress_missing_baselines
  save_plots: true
  overwrite: true
